# Target physicians for publication monitoring.
# Copy this file and replace placeholders; do not commit internal strategy notes here.

lookback_months: 24

therapeutic_area:
  keywords:
    - polycythemia vera
    - myeloproliferative neoplasm
    - MPN
    - essential thrombocythemia
    - myelofibrosis
    - JAK2
    - interferon
    - ropeginterferon
    - hydroxyurea
    - thrombosis
  exclude:
    - pediatric-only
    - veterinary
    - murine
    - in vitro only

ncbi:
  # No NCBI signup, account, or API key. Only an optional label on public PubMed requests.
  tool: physician-pubs-bot
