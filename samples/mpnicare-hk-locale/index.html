      --ink: #2b2b2b;
      --muted: #5b5b5b;
      --pink: #d81b60;

      --coral: #c45c54;

    * { box-sizing: border-box; }

    button { font-family: inherit; cursor: pointer; }

      gap: 16px;
      padding: 10px 24px;
      font-size: 13px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .sample-bar strong { color: #9ef0e4; }
    .sample-bar .actions { display: flex; gap: 8px; flex-wrap: wrap; }

      background: #1f5c63;
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
    }

      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px 8px;
    }
    .logo {

      align-items: center;
      gap: 8px;
      min-width: 180px;
      cursor: pointer;
    }
    .logo img { height: 52px; width: auto; }

      align-items: center;
      gap: 2px;
      flex: 1;
      flex-wrap: nowrap;

    }

      position: relative;
      background: none;
      border: 0;
      padding: 10px 10px;
      font-size: 15px;
      color: #333;
      border-radius: 6px;
      white-space: nowrap;
    }

    .nav-item.home-active {
      background: var(--pink-bg);
      color: var(--pink);
      font-weight: 700;
    }
    .nav-item:hover { background: rgba(255,255,255,.45); }
    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      min-width: 280px;
      box-shadow: var(--shadow);
      border-radius: 10px;
      padding: 8px;
      z-index: 20;
      white-space: normal;
    }
    html[data-locale="en"] .dropdown { min-width: 300px; }
    .has-drop:hover .dropdown, .has-drop:focus-within .dropdown { display: block; }
    .dropdown a, .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .dropdown a:hover, .dropdown button:hover { background: var(--hero); }

    .lang {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-left: auto;
    }
    .lang button {
      border: 1px solid #7aabb0;
      background: rgba(255,255,255,.55);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .lang button.on {
      background: #12353a;
      color: #fff;
      border-color: #12353a;
    }

    main { background: var(--hero); min-height: 520px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 24px 64px; }

    .hero-copy { text-align: center; max-width: 880px; margin: 0 auto; }
    .hero-copy p { font-size: 22px; line-height: 1.85; margin: 0 0 22px; }
    .en-note { color: #c0392b; font-size: 18px; font-weight: 500; }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--coral);
      color: #fff;
      border: 0;
      border-radius: 28px;
      padding: 12px 22px;
      font-size: 16px;
      margin-top: 8px;
    }

    .latest {
      background: var(--teal);
      padding: 48px 24px 28px;
    }
    .latest h2 { text-align: center; font-size: 42px; margin: 0 0 22px; font-weight: 700; }
    .chips { display: flex; justify-content: center; gap: 18px; margin-bottom: 28px; flex-wrap: wrap; }
    .chip {
      background: var(--chip);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 8px 22px;
      font-size: 16px;
    }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; max-width: 1120px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      cursor: pointer;
      min-height: 430px;

    .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .card .body { padding: 16px 18px 22px; }

    .card h3 { font-size: 22px; line-height: 1.4; margin: 0 0 10px; }
    .card p { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0; }

      max-width: 1120px;
      margin: 0 auto 18px;
      background: #f7f7f7;
      border-left: 3px solid #9eb8c8;
      color: #555;
      padding: 8px 14px;
      font-size: 14px;
      line-height: 1.6;
      display: none;

    .banner b { font-weight: 700; margin-right: 6px; }
    .tag {
      display: none;
      background: var(--tag-bg);
      color: var(--tag);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: .02em;

    .article-flag {
      display: none;
      color: var(--tag);
      font-size: 14px;
      margin: 6px 0 16px;
      font-weight: 600;
    }
    html[data-locale="zh-HK"] .article-flag,

      text-align: center;
      padding: 0 0 8px;

    .foot-grid {

      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
      gap: 32px;
      align-items: start;

    .pec { height: 22px; }
    .legal { font-size: 12px; line-height: 1.8; color: #444; max-width: 100%; }

    .line-box {

      align-items: flex-end;
      gap: 10px;
      text-align: right;

      font-size: 18px;

    .matrix th { background: #12353a; color: #fff; }
    .matrix tr:nth-child(even) { background: #f4fbfb; }
    .old { color: #a33; text-decoration: line-through; }
    .new { color: #0b6e3f; font-weight: 700; }

      header.site { flex-wrap: wrap; }
      nav.main { flex-wrap: wrap; }
      .foot-grid { grid-template-columns: 1fr; }
      .line-box { align-items: flex-start; text-align: left; max-width: 100%; }

</head>

              <button class="cta" type="button">Complete the Form →</button>

          </section>
          <section class="latest">
            <h2>${x.latest}</h2>
            <div class="chips">
              <button class="chip" data-go="medical">${x.medical}</button>
              <button class="chip" data-go="health">${x.health}</button>
              <button class="chip" data-go="life">${x.lifeTitle}</button>
            </div>
            <div class="cards">
              ${card("medical")}${card("health")}${card("life")}
            </div>
          </section>`;
      } else if (page === "blood") {
        app.innerHTML = `<section class="wrap">
          <h1 class="page-title">${x.bloodH}</h1>
          <div class="prose"><p>${x.bloodBody}</p></div>
        </section>`;
      } else if (page === "about") {
        app.innerHTML = `<section class="wrap">
          <h1 class="page-title">${x.aboutH}</h1>
          <div class="prose">
            <h2>${x.aboutLead}</h2>
            <p>${x.aboutBody}</p>
            <p>${x.pv}</p>
            <p>${x.et}</p>
            <p>${x.pmf}</p>
            <p><button class="cta" data-go="edu">${x.more}</button></p>
          </div>
        </section>`;
      } else if (page === "edu") {
        app.innerHTML = `<section class="wrap">
          <h1 class="page-title">${x.eduH}</h1>
          <div class="edu-grid">
            <div class="edu-card"><div class="cover">${x.edu1}</div><div class="label">${x.edu1}</div></div>
            <div class="edu-card"><div class="cover">${x.edu2}</div><div class="label">${x.edu2}</div></div>
            <div class="edu-card"><div class="cover">${x.edu3}</div><div class="label">${x.edu3}</div></div>
            <div class="edu-card"><div class="cover">${x.edu4}</div><div class="label">${x.edu4}</div></div>
          </div>
        </section>`;
      } else if (page === "medical" || page === "health" || page === "life") {
        app.innerHTML = listPage(page);
      } else if (page === "links") {
        app.innerHTML = `<section class="wrap">
          <h1 class="page-title">${x.links}</h1>
          <p class="prose" style="text-align:center;color:#555;">${x.linksNote}</p>
          <div class="link-list">
            <div class="link-card"><a href="http://www.tbmt.org.tw/" target="_blank" rel="noopener">中華民國血液及骨髓移植學會</a></div>
            <div class="link-card"><a href="https://www.tmpna.tw/" target="_blank" rel="noopener">台灣骨髓增生性腫瘤關懷協會</a></div>
            <div class="link-card"><a href="http://www.hematology.org.tw/web2/project/" target="_blank" rel="noopener">中華民國血液病學會</a></div>
          </div>
        </section>`;
      } else if (page === "terms") {
        app.innerHTML = `<section class="wrap">${locale === "zh-HK" ? TERMS_HK : locale === "en" ? TERMS_EN : TERMS_TW}</section>`;
      } else if (page === "article") {
        const a = ARTICLES[currentArticle];
        const cat = currentArticle === "medical" ? x.medical : currentArticle === "health" ? x.health : x.lifeTitle;
        app.innerHTML = `<section class="wrap article">
          <div class="kicker">${cat} <span class="tag">${x.cardTag}</span></div>
          <h1>${a.title}</h1>
          <div class="article-flag">${x.articleFlag}</div>
          <div class="byline">${a.author}　｜　${a.date}</div>
          <div class="bodycopy">${a.body}</div>
        </section>`;
      } else if (page === "matrix") {
        app.innerHTML = renderMatrix();
      }
      bind();
    }

    function renderMatrix() {
      const hkRows = [
        ["全站選單", "血腫專欄", "血液腫瘤專欄", "只改選單；文章正文不改"],
        ["全站選單", "健康照護", "健康資訊", "只改選單；文章正文不改"],
        ["選單／標題", "品味生活／生活品味", "統一「品味生活」", "消除字序不一致"],
        ["頁尾", "智慧財產權／資訊／帳號", "知識產權／資料／賬號", "全站共用頁尾"],
        ["首頁", "並發症（現行香港機翻）", "併發症", "醫學正字"],
        ["關於MPN", "紅細胞／白細胞／按我了解更多", "紅血球／白血球／按此了解更多", "避免機翻把原文改差"],
        ["病人教育專區", "衛教專區／紅細胞增多症／有愛相髓…", "病人教育專區／紅血球增多症／病友故事集", "只改分類名稱"],
        ["血腫／健康／品味 欄目頁", "（無標示）", "標題下加一欄「其他地區內容提示」", "不套用到病人教育專區"],
        ["該三欄文章卡／文章頁", "（無標示）", "分類名旁標籤；標題下加一行", "正文、藥物、數據不改"],
        ["使用條款", "個資／個資法3、10、11條／百份百／藥華藥", "個人資料／《私隱》條例重寫／百分百／藥華醫藥", "法律稿，須合規審閱"]
      ];
      const enRows = [
        ["Menu", "front page / Hematoma column / health care", "Home / Hematology / Health information", "Hematoma is a bruise, not 血液腫瘤"],
        ["About MPN", "myeloproliferative tumor / Erythrocytosis vera / Click me", "myeloproliferative neoplasm / polycythemia vera / Learn more", "Use WHO / ASH names"],
        ["Patient education", "thrombocytopenia / Patients with Myelopathy", "essential thrombocythemia / Patient stories", "Those two machine translations are clinically wrong"],
        ["Terms", "Medical sexual information / PharmaEssence / Taiwan PDPA Arts 3, 10, 11", "Medical information / PharmaEssentia / Cap. 486 rewrite", "Legal review draft"],
        ["Three columns", "No posts published in this language yet", "Keep original articles + region label", "Do not empty the rails"],
        ["Top menu", "新網頁 / two extra 關於 / 搜尋結果 / More", "Same 7 items as Chinese; hide extras", "新網頁 is not on the Chinese site"],
        ["About MPN dropdown", "血液數據怎麼看 / 什麼是MPN？ / Chinese disease names", "How to read blood results / What is MPN? / PV, ET, PMF", "Do not leave Chinese inside English menus"],
        ["Education dropdown", "關於 + 副本 副本 衛教手冊", "Patient education + 4 English titles", "關於 was a mistranslated 衛教專區"],
        ["Footer", "LINE text overlaps privacy / cookies", "LINE stacked on the right; legal text in its own column", "Wix absolute boxes collide in English"]
      ];
      return `<section class="wrap">
        <h1 class="page-title">${locale === "en" ? "Wording overlay (sample)" : "用字對照（樣本）"}</h1>
        <p class="prose" style="margin-bottom:18px;">${locale === "en"
          ? "Use the language buttons to switch chrome copy. Article bodies in Hematology / Health information / Lifestyle stay in the original Chinese."
          : "點右上角語言後，固定頁用字會即時切換；三欄文章正文維持原文。"}</p>
        <h2>${locale === "en" ? "Hong Kong Chinese" : "香港中文"}</h2>
        <table class="matrix">
          <tr><th>位置</th><th>現行／原文</th><th>香港版</th><th>說明</th></tr>
          ${hkRows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="new">${r[2]}</td><td>${r[3]}</td></tr>`).join("")}
        </table>
        <h2 style="margin-top:28px;">${locale === "en" ? "English (replace live Google Translate)" : "英文（取代現有 Google 翻譯）"}</h2>
        <table class="matrix">
          <tr><th>Place</th><th>Live /en today</th><th>Suggested English</th><th>Why</th></tr>
          ${enRows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="new">${r[2]}</td><td>${r[3]}</td></tr>`).join("")}
        </table>
      </section>`;
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          page = el.getAttribute("data-go");
          window.scrollTo({ top: 0, behavior: "smooth" });
          render();
        });
      });
      document.querySelectorAll("[data-article]").forEach((el) => {
        el.addEventListener("click", () => {
          currentArticle = el.getAttribute("data-article");
          page = "article";
          window.scrollTo({ top: 0, behavior: "smooth" });
          render();
        });
      });
    }

    function syncUrl() {
      const next = new URL(location.href);
      next.searchParams.set("lang", locale);
      next.searchParams.set("page", page);
      if (page === "article") next.searchParams.set("article", currentArticle);
      else next.searchParams.delete("article");
      history.replaceState(null, "", next);
    }
    $("btn-tw").onclick = () => { locale = "zh-TW"; render(); };
    $("btn-hk").onclick = () => { locale = "zh-HK"; render(); };
    $("btn-en").onclick = () => { locale = "en"; render(); };
    const _render = render;
    render = function wrappedRender() { syncUrl(); _render(); };
    _render();
  </script>
</body>
</html>
